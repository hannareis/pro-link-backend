services:
  # Proxy reverso: recebe as requisicoes HTTPS/HTTP e repassa .php para o app-php.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-php

  # Container da aplicacao PHP (PHP-FPM 8.2), onde o codigo-fonte roda de fato.
  app-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - mariadb

  # Banco de dados relacional, com volume persistente isolado do ciclo de vida do container.
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # _arq/estrutura.sql (Anexo I, item 8.3.2-a) e executado automaticamente na primeira subida.
      - ./_arq/estrutura.sql:/docker-entrypoint-initdb.d/estrutura.sql:ro
    ports:
      - "3306:3306"

volumes:
  db_data:
