server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # Toda rota inexistente cai no Front Controller (public/index.php), que faz o roteamento interno.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Repassa a execucao de arquivos .php para o PHP-FPM no container app-php.
    location ~ \.php$ {
        fastcgi_pass app-php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bloqueia acesso a arquivos ocultos (.htaccess, .env etc).
    location ~ /\.ht {
        deny all;
    }
}
