; O php:8.2-fpm-alpine padrao vem com upload_max_filesize=2M e post_max_size=8M.
; A aplicacao (FileUploadService) ja valida um limite de ate 5MB por arquivo (cartas
; virtuais, posts, comprovante de matricula), mas o PHP rejeitava a requisicao ANTES
; desse codigo rodar: quando o upload excede post_max_size, o PHP descarta $_POST
; inteiro (inclusive o campo _csrf), o que aparecia como erro 419 (CSRF invalido) em
; vez de um erro claro de arquivo grande demais.
upload_max_filesize = 8M
post_max_size = 10M
